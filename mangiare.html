<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mangiare a Trento — OraVicino</title>

  <meta
    name="description"
    content="Scopri ristoranti, trattorie, osterie e piccoli posti dove mangiare a Trento."
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- LEAFLET -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <style>

    /* ========================================
       PAGINA MANGIARE
    ======================================== */

    .food-page {
      max-width: 1240px;
      margin: auto;
      padding: 35px 30px 100px;
    }


    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 15px 0 50px;
      color: #6d746f;
      font-weight: 600;
      transition: color .2s ease;
    }


    .back:hover {
      color: #173f32;
    }



    /* ========================================
       CABEÇALHO
    ======================================== */

    .food-header {
      margin-bottom: 35px;
    }


    .food-header h1 {
      margin: 8px 0 12px;
      font-size: clamp(48px, 6vw, 78px);
      letter-spacing: -4px;
      line-height: .95;
    }


    .food-header p {
      max-width: 600px;
      margin: 0;
      color: #6d746f;
      font-size: 18px;
      line-height: 1.5;
    }



    /* ========================================
       BUSCA
    ======================================== */

    .food-search {
      max-width: 700px;
      background: white;
      border-radius: 18px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 15px 45px rgba(25,39,32,.08);
    }


    .food-search-icon {
      font-size: 22px;
    }


    .food-search input {
      flex: 1;
      min-width: 0;
      padding: 13px 5px;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #17231d;
    }



    /* ========================================
       FILTROS
    ======================================== */

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 20px 0 45px;
    }


    .filter {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(23,35,29,.15);
      background: transparent;
      color: #17231d;
      cursor: pointer;
      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
    }


    .filter:hover {
      border-color: #173f32;
      background: rgba(23,63,50,.06);
    }


    .filter.active {
      background: #173f32;
      color: white;
      border-color: #173f32;
    }



    /* ========================================
       CABEÇALHO DOS RESULTADOS
    ======================================== */

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }


    .results-header strong {
      font-size: 14px;
    }


    .map-label {
      color: #6d746f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
    }



    /* ========================================
       LAYOUT
    ======================================== */

    .discovery-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1.15fr)
        minmax(360px, .85fr);

      gap: 24px;
      align-items: start;
    }



    /* ========================================
       LISTA
    ======================================== */

    .restaurants {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }



    /* ========================================
       CARD
    ======================================== */

    .restaurant {
      position: relative;
      overflow: hidden;

      background: #fffdf8;

      border:
        2px solid
        rgba(23,35,29,.10);

      border-radius: 24px;

      cursor: pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }


    .restaurant:hover {
      transform: translateY(-4px);

      border-color:
        rgba(23,63,50,.30);

      box-shadow:
        0 18px 50px
        rgba(25,39,32,.10);
    }



    /* RESTAURANTE SELECIONADO */

    .restaurant.selected {
      border-color: #173f32;

      box-shadow:
        0 18px 55px
        rgba(23,63,50,.20);
    }


    .restaurant.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #173f32;
      border-radius: 22px;
      pointer-events: none;
    }



    /* ========================================
       CAPA
    ======================================== */

    .restaurant-cover {
      height: 175px;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 75% 20%,
          rgba(242,193,78,.55),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          #285d49,
          #173f32
        );

      font-size: 55px;
    }



    /* ========================================
       NÚMERO DO RESTAURANTE
    ======================================== */

    .restaurant-number {
      position: absolute;

      right: 15px;
      top: 15px;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fffdf8;
      color: #173f32;

      border:
        2px solid
        rgba(23,63,50,.15);

      font-size: 12px;
      font-weight: 800;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);
    }



    /* ========================================
       FUORI DAL PERCORSO
    ======================================== */

    .route-badge {
      position: absolute;

      left: 16px;
      top: 16px;

      padding: 7px 10px;

      border-radius: 999px;

      background: #f2c14e;
      color: #17231d;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .7px;
    }



    /* ========================================
       CONTEÚDO DO CARD
    ======================================== */

    .restaurant-content {
      padding: 22px;
    }


    .restaurant-area {
      color: #ef6a3a;

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1.2px;
    }


    .restaurant h2 {
      margin: 7px 0 6px;

      font-size: 23px;
      line-height: 1.1;

      letter-spacing: -1px;
    }


    .category {
      min-height: 24px;

      color: #6d746f;

      line-height: 1.4;
    }


    .address {
      margin-top: 14px;

      color: #6d746f;

      font-size: 13px;

      line-height: 1.4;
    }


    .restaurant-info {
      margin-top: 20px;

      padding-top: 17px;

      border-top:
        1px solid
        rgba(23,35,29,.1);

      display: flex;
      justify-content: space-between;

      gap: 15px;

      font-size: 13px;
      font-weight: 600;
    }



    /* ========================================
       MAPA
    ======================================== */

    .map-column {
      position: sticky;
      top: 20px;
    }


    .map-wrapper {
      position: relative;
    }


    #map {
      width: 100%;

      height:
        calc(100vh - 40px);

      min-height: 620px;

      border-radius: 28px;

      overflow: hidden;

      border:
        1px solid
        rgba(23,35,29,.12);

      box-shadow:
        0 18px 50px
        rgba(25,39,32,.08);

      background: #e8e7df;
    }


    .map-badge {
      position: absolute;

      z-index: 500;

      top: 16px;
      left: 50%;

      transform:
        translateX(-50%);

      padding: 9px 15px;

      border-radius: 999px;

      background:
        rgba(255,253,248,.94);

      border:
        1px solid
        rgba(23,35,29,.12);

      box-shadow:
        0 8px 25px
        rgba(25,39,32,.10);

      color: #173f32;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: .7px;

      white-space: nowrap;
    }


    .leaflet-container {
      font-family:
        "DM Sans",
        sans-serif;
    }


    .leaflet-control-attribution {
      font-size: 10px;
    }



    /* ========================================
       PIN PERSONALIZADO
    ======================================== */

    .oravicino-marker {
      background: transparent;
      border: 0;
    }


    .marker-pin {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      border-radius:
        50% 50% 50% 4px;

      transform:
        rotate(-45deg);

      background: #173f32;

      border:
        3px solid #fffdf8;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.28);

      transition:
        transform .18s ease,
        background .18s ease;
    }


    .marker-pin span {
      transform: rotate(45deg);

      color: white;

      font-size: 11px;
      font-weight: 800;
    }



    /* PIN SELECIONADO */

    .marker-pin.active {
      background: #ef6a3a;

      transform:
        rotate(-45deg)
        scale(1.28);

      z-index: 999;
    }



    /* ========================================
       POPUP
    ======================================== */

    .popup-content {
      min-width: 175px;
      padding: 3px;
    }


    .popup-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;

      margin-bottom: 7px;

      border-radius: 50%;

      background: #173f32;
      color: white;

      font-size: 10px;
      font-weight: 800;
    }


    .popup-content strong {
      display: block;

      margin-bottom: 4px;

      color: #17231d;

      font-size: 14px;
    }


    .popup-category {
      color: #6d746f;

      font-size: 12px;
    }


    .popup-address {
      margin-top: 7px;

      color: #6d746f;

      font-size: 11px;
    }



    /* ========================================
       SEM RESULTADOS
    ======================================== */

    .empty {
      grid-column: 1 / -1;

      padding: 70px 20px;

      text-align: center;

      color: #6d746f;

      background:
        rgba(255,255,255,.35);

      border-radius: 24px;
    }



    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 1000px) {

      .discovery-layout {
        grid-template-columns: 1fr;
      }


      .map-column {
        position: relative;
        top: auto;
        order: -1;
      }


      #map {
        height: 440px;
        min-height: 0;
      }


      .restaurants {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }



    /* ========================================
       CELULAR
    ======================================== */

    @media (max-width: 560px) {

      .food-page {
        padding: 20px 18px 70px;
      }


      .back {
        margin-bottom: 35px;
      }


      .food-header h1 {
        letter-spacing: -2.5px;
      }


      .food-header p {
        font-size: 16px;
      }


      .filters {
        flex-wrap: nowrap;

        overflow-x: auto;

        padding-bottom: 5px;

        scrollbar-width: none;
      }


      .filters::-webkit-scrollbar {
        display: none;
      }


      .filter {
        flex: 0 0 auto;
      }


      .restaurants {
        grid-template-columns: 1fr;
      }


      #map {
        height: 390px;
        border-radius: 22px;
      }


      .map-label {
        display: none;
      }

    }

  </style>

</head>



<body>


  <!-- ========================================
       HEADER
  ======================================== -->

  <header class="topbar">

    <a
      class="logo"
      href="index.html"
    >
      ora<span>vicino</span>
    </a>


    <div class="top-actions">

      <button
        class="city-button"
        type="button"
      >
        📍 Trento
      </button>


      <button
        class="language-button"
        type="button"
      >
        IT ▾
      </button>

    </div>

  </header>



  <!-- ========================================
       CONTEÚDO
  ======================================== -->

  <main class="food-page">


    <a
      class="back"
      href="index.html"

    </a>



    <section class="food-header">

      </span>

    <div class="filters">

      </button>


      <button
        class="filter"

      </button>


      <button
        class="filter"
        data-filter="osteria"
        type="button"
      >
        🍷 Osteria
      </button>


      <button
        class="filter"
        data-filter="fuori-percorso"
        type="button"
      >

      </button>


      <button
        class="filter"
        data-filter="€€"
        type="button"
      >
        €€
      </button>

        class="filter"

        type="button"
      >

    <div class="results-header">

      <strong id="resultCount">

  <!-- ========================================

  <footer>

    <a
      class="logo"

    >
      ora<span>vicino</span>

    <p>

    </p>

  <!-- ========================================
       JAVASCRIPT
  ======================================== -->

  <script>

    /* ========================================
       ESTADO
    ======================================== */

    let restaurants = [];

    let currentFilter = "all";

    let selectedRestaurantId = null;

    let markers = {};

    let visibleRestaurants = [];


    const container =
      document.getElementById("restaurants");


    const search =
      document.getElementById("search");


    const count =
      document.getElementById("resultCount");



    /* ========================================
       MAPA
    ======================================== */

    const map = L.map(
      "map",
      {
        zoomControl: true,
        scrollWheelZoom: true
      }
    ).setView(
      [46.0679, 11.1211],
      14
    );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,

        attribution:
          '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);



    /* ========================================
       CARREGAR RESTAURANTES
    ======================================== */

    async function loadRestaurants() {

      try {

        const response =
          await fetch(
            "data/restaurants.json"
          );


        if (!response.ok) {

          throw new Error(
            "Errore HTTP " +
            response.status
          );

        }


        restaurants =
          await response.json();


        /*
          Número fixo de cada restaurante.

          Assim o número não muda
          quando aplicamos filtros.
        */

        restaurants =
          restaurants.map(
            (item, index) => ({
              ...item,
              number: index + 1
            })
          );


        visibleRestaurants =
          [...restaurants];


        renderRestaurants(
          visibleRestaurants
        );


        updateMarkers(
          visibleRestaurants
        );

      }


      catch (error) {

        container.innerHTML = `

          <div class="empty">

            Impossibile caricare
            i ristoranti.

          </div>

        `;


        count.textContent =
          "Errore nel caricamento";


        console.error(error);

      }

    }



    /* ========================================
       EMOJI
    ======================================== */

    function restaurantEmoji(item) {

      const tags =
        Array.isArray(item.tags)
          ? item.tags
          : [];


      const text =
        (
          (item.category || "") +
          " " +
          tags.join(" ")
        ).toLowerCase();


      if (text.includes("pizza")) {
        return "🍕";
      }


      if (text.includes("osteria")) {
        return "🍷";
      }


      if (
        text.includes("trentino") ||
        text.includes("territorio")
      ) {
        return "🥘";
      }


      if (text.includes("birra")) {
        return "🍺";
      }


      return "🍽️";

    }



    /* ========================================
       RENDER DOS CARDS
    ======================================== */

    function renderRestaurants(items) {

      count.textContent =
        items.length +
        (
          items.length === 1
            ? " posto trovato"
            : " posti trovati"
        );


      if (!items.length) {

        container.innerHTML = `

          <div class="empty">

            Nessun posto trovato.
            <br><br>

            Prova un'altra ricerca
            o cambia filtro.

          </div>

        `;

        return;

      }


      container.innerHTML =
        items.map(
          item => {


            const tags =
              Array.isArray(item.tags)
                ? item.tags
                : [];


            const fuori =
              tags.includes(
                "fuori-percorso"
              );


            const selected =
              item.id ===
              selectedRestaurantId;


            return `

              <article
                class="restaurant
                ${selected ? "selected" : ""}"
                data-id="${item.id}"
                tabindex="0"
                role="button"
                aria-label="Mostra ${item.name} sulla mappa"
              >


                <div
                  class="restaurant-cover"
                >


                  ${
                    fuori

                      ? `

                        <span
                          class="route-badge"
                        >
                          FUORI DAL PERCORSO
                        </span>

                      `

                      : ""
                  }


                  <span
                    class="restaurant-number"
                  >
                    ${item.number}
                  </span>


                  <span>
                    ${restaurantEmoji(item)}
                  </span>


                </div>



                <div
                  class="restaurant-content"
                >


                  <span
                    class="restaurant-area"
                  >
                    ${item.area || "Trento"}
                  </span>


                  <h2>
                    ${item.name}
                  </h2>


                  <div
                    class="category"
                  >
                    ${item.category || "Ristorante"}
                  </div>


                  <div
                    class="address"
                  >
                    📍 ${item.address}
                  </div>


                  <div
                    class="restaurant-info"
                  >

                    <span>
                      ${item.price || ""}
                    </span>

                    <span>
                      Mappa →
                    </span>

                  </div>


                </div>


              </article>

            `;

          }
        ).join("");


      addCardEvents();

    }



    /* ========================================
       EVENTOS DOS CARDS
    ======================================== */

    function addCardEvents() {

      document
        .querySelectorAll(".restaurant")
        .forEach(card => {


          card.addEventListener(
            "click",
            () => {

              selectRestaurant(
                card.dataset.id,
                "card"
              );

            }
          );


          card.addEventListener(
            "keydown",
            event => {

              if (
                event.key === "Enter" ||
                event.key === " "
              ) {

                event.preventDefault();

                selectRestaurant(
                  card.dataset.id,
                  "card"
                );

              }

            }
          );

        });

    }



    /* ========================================
       ÍCONE DO MAPA
    ======================================== */

    function createMarkerIcon(
      item,
      active = false
    ) {

      return L.divIcon({

        className:
          "oravicino-marker",

        html: `

          <div
            class="marker-pin
            ${active ? "active" : ""}"
          >

            <span>
              ${item.number}
            </span>

          </div>

        `,

        iconSize:
          [40, 40],

        iconAnchor:
          [20, 38],

        popupAnchor:
          [0, -36]

      });

    }



    /* ========================================
       LIMPAR PINS
    ======================================== */

    function clearMarkers() {

      Object.values(markers)
        .forEach(marker => {

          map.removeLayer(marker);

        });


      markers = {};

    }



    /* ========================================
       CRIAR PINS
    ======================================== */

    function updateMarkers(items) {

      clearMarkers();


      const placesWithCoordinates =
        items.filter(
          item =>

            Number.isFinite(
              Number(item.lat)
            )

            &&

            Number.isFinite(
              Number(item.lng)
            )
        );


      placesWithCoordinates.forEach(
        item => {


          const active =
            item.id ===
            selectedRestaurantId;


          const marker =
            L.marker(
              [
                Number(item.lat),
                Number(item.lng)
              ],
              {
                icon:
                  createMarkerIcon(
                    item,
                    active
                  )
              }
            )
            .addTo(map);


          marker.bindPopup(`

            <div
              class="popup-content"
            >

              <span
                class="popup-number"
              >
                ${item.number}
              </span>

              <strong>
                ${item.name}
              </strong>

              <div
                class="popup-category"
              >
                ${item.category || ""}
              </div>

              <div
                class="popup-address"
              >
                📍 ${item.address || ""}
              </div>

            </div>

          `);


          marker.on(
            "click",
            () => {

              selectRestaurant(
                item.id,
                "marker"
              );

            }
          );


          markers[item.id] =
            marker;

        }
      );


      /*
        Ajustar mapa aos
        resultados atuais.
      */

      if (
        placesWithCoordinates.length > 1
        &&
        !selectedRestaurantId
      ) {

        const markerList =
          Object.values(markers);


        const group =
          L.featureGroup(
            markerList
          );


        map.fitBounds(
          group.getBounds(),
          {
            padding:
              [40, 40],

            maxZoom:
              15
          }
        );

      }


      else if (
        placesWithCoordinates.length === 1
        &&
        !selectedRestaurantId
      ) {

        map.setView(
          [
            Number(
              placesWithCoordinates[0].lat
            ),

            Number(
              placesWithCoordinates[0].lng
            )
          ],
          16
        );

      }

    }



    /* ========================================
       SELECIONAR RESTAURANTE
    ======================================== */

    function selectRestaurant(
      id,
      source
    ) {

      const item =
        restaurants.find(
          restaurant =>
            restaurant.id === id
        );


      if (!item) {
        return;
      }


      selectedRestaurantId =
        id;



      /* ----------------------------
         DESTACAR CARD
      ---------------------------- */

      document
        .querySelectorAll(
          ".restaurant"
        )
        .forEach(
          card => {

            card.classList.toggle(
              "selected",
              card.dataset.id === id
            );

          }
        );



      /* ----------------------------
         DESTACAR PIN
      ---------------------------- */

      Object.keys(markers)
        .forEach(
          markerId => {


            const restaurant =
              restaurants.find(
                r =>
                  r.id === markerId
              );


            if (!restaurant) {
              return;
            }


            markers[
              markerId
            ].setIcon(

              createMarkerIcon(
                restaurant,
                markerId === id
              )

            );

          }
        );



      /* ----------------------------
         APROXIMAR MAPA
      ---------------------------- */

      if (
        Number.isFinite(
          Number(item.lat)
        )
        &&
        Number.isFinite(
          Number(item.lng)
        )
      ) {

        map.flyTo(
          [
            Number(item.lat),
            Number(item.lng)
          ],
          17,
          {
            animate: true,
            duration: .8
          }
        );


        const marker =
          markers[id];


        if (marker) {

          setTimeout(
            () => {

              marker.openPopup();

            },
            500
          );

        }

      }



      /* ----------------------------
         SE VEIO DO PIN,
         IR ATÉ O CARD
      ---------------------------- */

      if (
        source === "marker"
      ) {

        const card =
          document.querySelector(
            `.restaurant[data-id="${id}"]`
          );


        if (card) {

          card.scrollIntoView(
            {
              behavior: "smooth",
              block: "center"
            }
          );

        }

      }

    }



    /* ========================================
       FILTROS
    ======================================== */

    function applyFilters() {

      const query =
        search.value
          .toLowerCase()
          .trim();


      visibleRestaurants =
        restaurants.filter(
          item => {


            const tags =
              Array.isArray(item.tags)
                ? item.tags
                : [];


            const searchable =
              [

                item.name || "",

                item.category || "",

                item.area || "",

                item.address || "",

                ...tags

              ]
              .join(" ")
              .toLowerCase();


            const matchesSearch =
              searchable.includes(
                query
              );


            let matchesFilter =
              true;


            if (
              currentFilter !== "all"
            ) {


              if (
                currentFilter === "€€"
                ||
                currentFilter === "€€€"
              ) {

                matchesFilter =
                  item.price ===
                  currentFilter;

              }


              else {

                matchesFilter =
                  tags.includes(
                    currentFilter
                  );

              }

            }


            return (
              matchesSearch
              &&
              matchesFilter
            );

          }
        );



      /*
        Se o restaurante selecionado
        desapareceu com o filtro,
        removemos a seleção.
      */

      if (
        selectedRestaurantId
        &&
        !visibleRestaurants.some(
          item =>
            item.id ===
            selectedRestaurantId
        )
      ) {

        selectedRestaurantId =
          null;

      }



      renderRestaurants(
        visibleRestaurants
      );


      updateMarkers(
        visibleRestaurants
      );

    }



    /* ========================================
       BUSCA
    ======================================== */

    search.addEventListener(
      "input",
      applyFilters
    );



    /* ========================================
       FILTROS
    ======================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {


          button.addEventListener(
            "click",
            () => {


              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  b => {

                    b.classList.remove(
                      "active"
                    );

                  }
                );


              button.classList.add(
                "active"
              );


              currentFilter =
                button.dataset.filter;


              selectedRestaurantId =
                null;


              applyFilters();

            }
          );

        }
      );



    /* ========================================
       INICIAR
    ======================================== */

    loadRestaurants();



    window.addEventListener(
      "load",
      () => {

        setTimeout(
          () => {

            map.invalidateSize();

          },
          150
        );

      }
    );

  </script>


</body>

</html>

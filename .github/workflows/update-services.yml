name: Aggiorna servizi OraVicino

on:
  workflow_dispatch:

  schedule:
    # Ogni giorno alle 04:27 UTC
    - cron: "27 4 * * *"

permissions:
  contents: write

jobs:

  update-services:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Aggiorna servizi da OpenStreetMap
        run: node scripts/update-services.js


      - name: Controlla servizi.json
        run: |
          echo "===== SERVIZI.JSON ====="
          ls -lh data/servizi.json
          echo ""
          echo "Prime righe:"
          head -40 data/servizi.json


      - name: Verifica modifiche
        id: changes
        run: |
          if git diff --quiet -- data/servizi.json; then
            if git ls-files --error-unmatch data/servizi.json >/dev/null 2>&1; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Commit aggiornamento
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/servizi.json

          git commit -m "Aggiorna servizi OraVicino"

          git push


      - name: Nessuna modifica
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Nessuna modifica ai servizi."

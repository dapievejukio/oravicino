name: Atualizar eventos OraVicino

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Consultar Agenda Trento
        run: node scripts/update-events.js

      - name: Verificar arquivo gerado
        run: |
          echo "Quantidade de eventos:"
          node -e "const e=require('./data/eventi.json'); console.log(e.length)"

          echo ""
          echo "Primeiros eventos:"
          node -e "const e=require('./data/eventi.json'); e.slice(0,15).forEach((x,i)=>console.log((i+1)+'. '+x.dateStart+' | '+x.title+(x.ongoing?' [IN CORSO]':'')))"

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/eventi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração em eventi.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "eventi.json foi alterado."
          fi

      - name: Salvar atualização no repositório
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/eventi.json

          git commit -m "Aggiorna agenda OraVicino"

          git push

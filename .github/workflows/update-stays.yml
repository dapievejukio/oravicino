name: Aggiorna Dormire OraVicino

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aggiorna strutture Dormire da OpenStreetMap
        run: node scripts/update-stays.js

      - name: Controlla dormire.json
        run: |
          echo "===== DORMIRE.JSON ====="
          ls -lh data/dormire.json
          echo ""
          echo "Prime righe:"
          head -60 data/dormire.json

      - name: Verifica modifiche
        id: changes
        run: |
          if git diff --quiet -- data/dormire.json; then
            if git ls-files --error-unmatch data/dormire.json >/dev/null 2>&1; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit aggiornamento
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dormire.json
          git commit -m "Aggiorna Dormire OraVicino"
          git push

      - name: Nessuna modifica
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Nessuna modifica alle strutture Dormire."
